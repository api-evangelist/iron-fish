aid: iron-fish
name: Iron Fish
description: >-
  Iron Fish is a zero-knowledge Layer 1 blockchain that brings optional,
  best-in-class privacy to cryptocurrency. Built on zk-SNARK cryptography, it
  lets anyone send, receive, and bridge assets privately across 20+
  EVM-compatible chains while running their own node. For developers, Iron Fish
  exposes a self-hosted node RPC server (over TCP, IPC, and HTTP with JSON and
  streaming responses) organized into chain, wallet, node, peer, miner, config,
  event, mempool, and worker namespaces, plus a hosted public REST API at
  api.ironfish.network powering the block explorer and faucet. Integration is
  supported by a first-party JavaScript SDK (@ironfish/sdk), Rust/Node bindings,
  and the ironfish CLI for node operation, wallet management, mining, and
  multisig. Backed by a16z and Electric Capital.
